name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  AWS_REGION: eu-central-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-1.amazonaws.com

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: packages/prisma
      - name: Lint API
        run: npm run lint --workspace=@p2p/api
        continue-on-error: true
      - name: Typecheck shared
        run: npm run typecheck --workspace=@p2p/shared
      - name: Typecheck API
        run: npm run typecheck --workspace=@p2p/api

  test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: p2p_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/p2p_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: packages/prisma
      - run: npx prisma migrate deploy
        working-directory: packages/prisma
      - name: Test shared
        run: npm run test --workspace=@p2p/shared
      - name: Test API
        run: npm run test --workspace=@p2p/api
        continue-on-error: true

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: packages/prisma

      - name: Build API
        run: npm run build --workspace=@p2p/api
      - name: Build Web
        run: npm run build --workspace=@p2p/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.API_URL }}
          INCLUDE_EXTERNAL_PLAYGROUND: 'true'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/p2p-api:latest
            ${{ env.ECR_REGISTRY }}/p2p-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/p2p-web:latest
            ${{ env.ECR_REGISTRY }}/p2p-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || vars.API_URL }}
            INCLUDE_EXTERNAL_PLAYGROUND=true

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Copy infra tracked in Git so EC2 stays in sync without a local clone (.env.prod and certbot/ stay on the host only).
      - name: Sync compose and host config templates to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          overwrite: true
          source: "docker-compose.prod.yml,nginx.conf,vault-config/"
          target: ${{ vars.EC2_APP_PATH || '/home/ubuntu/p2p' }}

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            # Must match the app directory on the server (see repository variable EC2_APP_PATH).
            APP_DIR="${{ vars.EC2_APP_PATH }}"
            APP_DIR="${APP_DIR:-/home/ubuntu/p2p}"
            cd "$APP_DIR"

            set -a
            # shellcheck source=/dev/null
            source .env.prod
            set +a

            export IMAGE_TAG="${{ github.sha }}"

            aws ecr get-login-password --region "${AWS_REGION}" \
              | docker login --username AWS --password-stdin "${ECR_REGISTRY}"

            # Pull while api/web keep running (~short switchover only on up -d). Needs enough root EBS (~50 GiB+).
            docker compose --env-file .env.prod -f docker-compose.prod.yml pull api web worker

            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps api \
              npx prisma migrate deploy --schema=prisma/schema.prisma

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --remove-orphans

            # Remove old p2p image layers after new containers reference the new images.
            docker image prune -af

            echo "Deploy complete: ${{ github.sha }}"
