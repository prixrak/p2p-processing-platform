# TLS paths assume one certificate covering apex, www, and api, e.g.:
#   certbot certonly --webroot -w /var/www/certbot \
#     -d p2p-processing-dev.com -d www.p2p-processing-dev.com -d api.p2p-processing-dev.com
# First -d becomes the folder name under /etc/letsencrypt/live/

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS — required when using variables in proxy_pass so hostnames
    # resolve at request time (avoids "host not found in upstream" at nginx startup).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

    # Redirect HTTP → HTTPS (ACME http-01 must reach /.well-known/acme-challenge/)
    server {
        listen 80;
        server_name p2p-processing-dev.com www.p2p-processing-dev.com api.p2p-processing-dev.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend: apex + www (start "web" when the Next image is deployed)
    server {
        listen 443 ssl;
        server_name p2p-processing-dev.com www.p2p-processing-dev.com;

        ssl_certificate /etc/letsencrypt/live/p2p-processing-dev.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/p2p-processing-dev.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $web_upstream http://web:3000;
            proxy_pass $web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # API: api.p2p-processing-dev.com
    server {
        listen 443 ssl;
        server_name api.p2p-processing-dev.com;

        ssl_certificate /etc/letsencrypt/live/p2p-processing-dev.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/p2p-processing-dev.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 25M;

        location /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            set $api_upstream http://api:3001;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
